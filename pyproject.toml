[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pss-decoder"
version = "0.1.0"
description = "Coordinated semantic-spatial refinement for remote sensing segmentation"
requires-python = ">=3.10"
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
include = ["pss_decoder*"]
